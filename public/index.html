<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp 24/7 Cloud Server</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #25D366; border-bottom: 2px solid #25D366; padding-bottom: 8px; }
        input[type="file"], input[type="text"] { margin: 15px 0; display: block; width: 90%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #25D366; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #128C7E; }
        .status { margin-top: 15px; font-weight: bold; font-size: 16px; }
        .code-display { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #128C7E; background: #e6f9ed; padding: 10px; border-radius: 5px; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>1. Connect WhatsApp Account</h2>
    <p>Apna WhatsApp number country code ke sath dalein (e.g., 919876543210):</p>
    <input type="text" id="phoneNumber" placeholder="919876543210">
    <button id="getPairingCodeBtn">Request Pairing Code</button>
    <div class="status" id="pairingStatus"></div>
</div>

<div class="container">
    <h2>2. Upload Multi-line TXT File</h2>
    <p>Apni automated replies wali Text (.txt) file upload karein.</p>
    <form id="uploadForm">
        <input type="file" id="messageFile" accept=".txt" required>
        <button type="submit">Upload & Update Bot</button>
    </form>
    <div class="status" id="uploadStatus"></div>
</div>

<script>
    // Pairing Code Request Logic
    document.getElementById('getPairingCodeBtn').addEventListener('click', async () => {
        const phone = document.getElementById('phoneNumber').value.trim();
        const statusDiv = document.getElementById('pairingStatus');
        
        if(!phone) {
            alert('Kripya phone number dalein!');
            return;
        }

        statusDiv.innerHTML = "Generating Pairing Code... Please wait.";
        statusDiv.style.color = "orange";

        try {
            const response = await fetch(`/get-code?phone=${phone}`);
            const data = await response.json();

            if (data.success) {
                statusDiv.innerHTML = `🔑 APNA CODE: <div class="code-display">${data.code}</div><br><small>Is code ko WhatsApp -> Linked Devices -> Link with phone number instead me dalein.</small>`;
                statusDiv.style.color = "green";
            } else {
                statusDiv.innerHTML = `❌ Error: ${data.message}`;
                statusDiv.style.color = "red";
            }
        } catch (error) {
            statusDiv.innerHTML = "❌ Server se connect nahi ho paya.";
            statusDiv.style.color = "red";
        }
    });

    // File Upload Logic
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('messageFile');
        const statusDiv = document.getElementById('uploadStatus');
        
        const formData = new FormData();
        formData.append('messages', fileInput.files[0]);

        statusDiv.innerText = "Uploading...";
        statusDiv.style.color = "orange";

        try {
            const response = await fetch('/upload-messages', { method: 'POST', body: formData });
            if (response.ok) {
                statusDiv.innerText = "✅ TXT file uploaded and bot updated!";
                statusDiv.style.color = "green";
            } else {
                statusDiv.innerText = "❌ Upload failed.";
                statusDiv.style.color = "red";
            }
        } catch (error) {
            statusDiv.innerText = "❌ Connection error.";
            statusDiv.style.color = "red";
        }
    });
</script>

</body>
</html>
