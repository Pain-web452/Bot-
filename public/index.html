<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #0a0a0a; color: #0f0; font-family: monospace; padding: 20px; }
        .box { border: 1px solid #0f0; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        input, textarea { background: #111; color: #0f0; border: 1px solid #0f0; padding: 8px; width: 100%; margin-bottom: 10px; box-sizing: border-box; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        #status { font-size: 18px; }
        #pairingCode { font-size: 28px; letter-spacing: 4px; color: #ff0; font-weight: bold; margin-top: 10px; }
        .group-item { display: flex; align-items: center; padding: 8px; border-bottom: 1px solid #333; }
        .group-item input { width: auto; margin: 0 10px 0 0; }
        #groupList { max-height: 300px; overflow-y: auto; background: #111; padding: 10px; }
        #log { background: #000; height: 150px; overflow-y: scroll; padding: 10px; font-size: 12px; }
    </style>
</head>
<body>
    <h2>🔒 WhatsApp Panel</h2>

    <div class="box">
        <h3>Status</h3>
        <div id="status">Connecting...</div>
    </div>

    <div class="box">
        <h3>🔑 Pairing Code</h3>
        <input id="phoneNumber" placeholder="Number with country code (e.g., 919876543210)" />
        <button onclick="getPairingCode()">Get Pairing Code</button>
        <div id="pairingCode">Waiting...</div>
        <small>WhatsApp → Linked Devices → Link with phone number → यह कोड डालें</small>
    </div>

    <div class="box">
        <h3>📋 Groups</h3>
        <button onclick="loadGroups()">Fetch Groups</button>
        <button onclick="selectAll()">Select All</button>
        <button onclick="clearAll()">Clear</button>
        <div id="groupList">Click "Fetch Groups" to load</div>
    </div>

    <div class="box">
        <h3>💬 Message</h3>
        <textarea id="message" rows="4" placeholder="Message text likho..."></textarea>
        <button onclick="sendMessage()">Send to Selected</button>
    </div>

    <div class="box">
        <h3>📜 Log</h3>
        <div id="log"></div>
    </div>

    <script>
        const socket = io();
        let selectedGroups = new Set();

        socket.on('status', (s) => document.getElementById('status').innerText = s);
        socket.on('log', (msg) => {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        });

        async function getPairingCode() {
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            if (!phoneNumber) return alert('Number daalo');

            document.getElementById('pairingCode').innerText = 'Loading...';

            try {
                const res = await fetch('/api/pairing-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber })
                });
                const data = await res.json();
                if (data.code) {
                    document.getElementById('pairingCode').innerText = data.code;
                } else {
                    document.getElementById('pairingCode').innerText = 'Error: ' + (data.error || 'unknown');
                }
            } catch (err) {
                document.getElementById('pairingCode').innerText = 'Error: ' + err.message;
            }
        }

        async function loadGroups() {
            const res = await fetch('/api/groups');
            if (!res.ok) return alert('Groups load failed. Pehle connect karo?');
            const groups = await res.json();
            const list = document.getElementById('groupList');
            list.innerHTML = '';
            if (!groups.length) { list.innerText = 'No groups found'; return; }
            groups.forEach(g => {
                const div = document.createElement('div');
                div.className = 'group-item';
                div.innerHTML = `
                    <input type="checkbox" value="${g.id}" onchange="toggleGroup(this)">
                    <span>${g.name} (${g.size} members)</span>
                `;
                list.appendChild(div);
            });
        }

        function toggleGroup(cb) {
            if (cb.checked) selectedGroups.add(cb.value);
            else selectedGroups.delete(cb.value);
        }

        function selectAll() {
            document.querySelectorAll('#groupList input[type=checkbox]').forEach(cb => {
                cb.checked = true;
                selectedGroups.add(cb.value);
            });
        }

        function clearAll() {
            document.querySelectorAll('#groupList input[type=checkbox]').forEach(cb => {
                cb.checked = false;
                selectedGroups.clear();
            });
        }

        async function sendMessage() {
            const message = document.getElementById('message').value;
            if (!selectedGroups.size) return alert('Pehle group select karo');
            if (!message.trim()) return alert('Message likho');

            const res = await fetch('/api/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ targets: [...selectedGroups], message })
            });
            const data = await res.json();
            alert(`Sent: ${data.sent}, Failed: ${data.failed}`);
        }
    </script>
</body>
</html>
