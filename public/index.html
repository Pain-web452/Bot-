<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24/7 Messenger Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(180deg, #fce4ec 0%, #f8bbd0 100%); min-height: 100vh; padding: 15px; }
  .container { max-width: 480px; margin: 0 auto; }

  /* Header */
  .header { text-align: center; margin-bottom: 18px; }
  .header .bolt { font-size: 32px; }
  .header h1 { color: #1a1a2e; font-size: 28px; font-weight: 900; margin: 5px 0; }
  .dev-badge { display: inline-block; background: #ff5c8a; color: #fff; padding: 8px 22px; border-radius: 20px; font-size: 12px; font-weight: bold; letter-spacing: 0.5px; margin-top: 8px; box-shadow: 0 3px 8px rgba(255,92,138,0.4); }

  /* Card */
  .card { background: #fff; border-radius: 18px; padding: 18px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }

  /* Labels */
  label { display: block; color: #2c2c3e; font-weight: 700; margin-top: 14px; margin-bottom: 6px; font-size: 14px; }
  label:first-child { margin-top: 0; }

  /* Inputs */
  textarea, input[type="text"] {
    width: 100%; padding: 12px 14px;
    border: 2px solid #f8c8dc; border-radius: 12px;
    font-size: 14px; font-family: 'Courier New', monospace;
    background: #fff; color: #333;
    transition: border 0.2s;
  }
  textarea { resize: vertical; min-height: 75px; }
  textarea::placeholder, input::placeholder { color: #bbb; font-family: 'Segoe UI', Arial, sans-serif; }
  textarea:focus, input:focus { outline: none; border-color: #ff5c8a; }

  /* File Upload */
  .file-upload {
    display: block; border: 2px dashed #ff5c8a; border-radius: 12px;
    padding: 22px; text-align: center; color: #ff5c8a;
    cursor: pointer; background: #fff5f9; font-weight: 700;
    font-size: 15px; transition: background 0.2s;
  }
  .file-upload:hover { background: #ffe0ec; }
  .file-upload input { display: none; }

  /* Message status */
  #msgStatus { font-size: 13px; color: #4caf50; margin-top: 8px; text-align: center; font-weight: 600; }

  /* Buttons */
  button {
    width: 100%; padding: 14px; margin-top: 12px;
    border: none; border-radius: 12px; font-size: 16px;
    font-weight: 700; cursor: pointer; transition: transform 0.1s;
  }
  button:active { transform: scale(0.98); }
  .start { background: linear-gradient(90deg, #ff5c8a, #ff3377); color: #fff; box-shadow: 0 4px 12px rgba(255,92,138,0.4); }
  .stop { background: #9e9e9e; color: #fff; }
  .clear { background: #ffc107; color: #000; width: auto; padding: 8px 18px; font-size: 14px; margin: 0; border-radius: 10px; }

  /* Logs */
  .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .log-header h2 { color: #ff5c8a; margin: 0; font-size: 18px; }
  #logs {
    background: #111; color: #0f0;
    font-family: 'Courier New', monospace;
    padding: 14px; border-radius: 12px;
    height: 280px; overflow-y: auto;
    font-size: 12px; line-height: 1.5;
  }
  #logs div { margin-bottom: 2px; }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="bolt">⚡</div>
    <h1>24/7 Messenger Bot</h1>
    <div class="bolt">⚡</div>
    <div class="dev-badge">DEVELOPER: RAJ MISHRA</div>
  </div>

  <!-- Configuration Card -->
  <div class="card">
    <label>Primary Cookies (Required):</label>
    <textarea id="primaryCookies" placeholder="c_user=...; xs=...;"></textarea>

    <label>Backup Cookies (Optional):</label>
    <textarea id="backupCookies" placeholder="Agar primary fail ho jaye to ye use hongi..."></textarea>

    <label>Target ID:</label>
    <input type="text" id="targetId" placeholder="Group/User ID">

    <label>Haters Name (Prefix):</label>
    <input type="text" id="haterName" placeholder="Optional">

    <label>Messages:</label>
    <label class="file-upload" for="msgFile">
      📁 Upload Messages File
      <input type="file" id="msgFile" accept=".txt" onchange="loadMessages(event)">
    </label>
    <div id="msgStatus"></div>

    <button class="start" onclick="startBot()">🚀 Start Bot</button>
    <button class="stop" onclick="stopBot()">🛑 Stop Bot</button>
  </div>

  <!-- Logs Card -->
  <div class="card">
    <div class="log-header">
      <h2>📜 Bot Logs</h2>
      <button class="clear" onclick="clearLogs()">Clear Logs</button>
    </div>
    <div id="logs"></div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const logs = document.getElementById('logs');
  let messages = [];

  socket.on('log', (msg) => {
    const p = document.createElement('div');
    p.textContent = msg;
    logs.appendChild(p);
    logs.scrollTop = logs.scrollHeight;
  });

  function loadMessages(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      const content = e.target.result;
      messages = content.split('\n').map(l => l.trim()).filter(l => l !== '');
      document.getElementById('msgStatus').textContent = `✅ ${messages.length} messages load ho gaye`;
      await fetch('/save-messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });
    };
    reader.readAsText(file);
  }

  async function startBot() {
    const primaryCookies = document.getElementById('primaryCookies').value;
    const backupCookies = document.getElementById('backupCookies').value;
    const targetId = document.getElementById('targetId').value;
    const haterName = document.getElementById('haterName').value;

    if (!primaryCookies.trim() && !backupCookies.trim()) {
      alert('Pehle Primary ya Backup cookies paste karein!');
      return;
    }
    if (!targetId.trim()) {
      alert('Target ID daalein!');
      return;
    }
    if (messages.length === 0) {
      alert('Pehle messages file upload karein!');
      return;
    }

    const res = await fetch('/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ primaryCookies, backupCookies, targetId, haterName })
    });
    const data = await res.json();
    console.log(data);
  }

  async function stopBot() {
    await fetch('/stop', { method: 'POST' });
  }

  function clearLogs() {
    logs.innerHTML = '';
  }
</script>

</body>
</html>
