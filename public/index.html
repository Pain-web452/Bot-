<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #0a0a0a; color: #0f0; font-family: monospace; padding: 20px; }
        .box { border: 1px solid #0f0; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        input, textarea { background: #111; color: #0f0; border: 1px solid #0f0; padding: 8px; width: 100%; margin-bottom: 10px; box-sizing: border-box; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        #status { font-size: 18px; }
    </style>
</head>
<body>
    <h2>🔒 WhatsApp Panel</h2>
    <div class="box">
        <h3>Status</h3>
        <div id="status">Connecting...</div>
    </div>
    <div class="box">
        <h3>Send Test Message</h3>
        <input id="target" placeholder="Group ID or Number (e.g., 123@g.us or 919876543210)" />
        <textarea id="message" rows="3" placeholder="Message text"></textarea>
        <button onclick="sendMessage()">Send</button>
    </div>
    <script>
        const socket = io();
        socket.on('status', (s) => {
            document.getElementById('status').innerText = s;
        });
        
        async function sendMessage() {
            const target = document.getElementById('target').value;
            const message = document.getElementById('message').value;
            const res = await fetch('/api/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target, message })
            });
            const data = await res.json();
            alert(data.success ? 'Sent!' : 'Error: ' + data.error);
        }
    </script>
</body>
</html>
