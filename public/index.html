<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FB Bot Panel</title>
<style>
  body { font-family: Arial; background: #ffe6f0; margin: 0; padding: 20px; }
  .card { background: #fff; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  h2 { color: #e91e63; }
  label { display: block; margin-top: 10px; font-weight: bold; color: #555; }
  input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ffb6c1; border-radius: 8px; box-sizing: border-box; font-family: monospace; }
  textarea { height: 120px; resize: vertical; }
  button { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
  .start { background: #e91e63; color: #fff; }
  .stop { background: #888; color: #fff; }
  .save { background: #4caf50; color: #fff; }
  .clear { background: #ffc107; color: #000; width: auto; padding: 8px 20px; }
  #logs { background: #111; color: #0f0; font-family: monospace; padding: 15px; border-radius: 10px; height: 300px; overflow-y: auto; font-size: 13px; }
  .log-header { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>

<div class="card">
  <h2>⚙️ Step 3: Bot Configuration</h2>

  <label>Group ID (Jis group mein bhejna hai)</label>
  <input type="text" id="groupId" value="1578315594071492">

  <label>Interval (Seconds) — Default 3600 (1 hour)</label>
  <input type="number" id="interval" value="3600">

  <label>🍪 Cookies (appstate.json ka content paste karein)</label>
  <textarea id="cookies" placeholder='[
  {"key": "c_user", "value": "...", "domain": ".facebook.com", "path": "/"},
  {"key": "xs", "value": "...", "domain": ".facebook.com", "path": "/"},
  {"key": "datr", "value": "...", "domain": ".facebook.com", "path": "/"}
]'></textarea>

  <label>💬 Message (Jo group mein bhejna hai)</label>
  <textarea id="messageBox" placeholder="Yahan message likhein..."></textarea>
  <button class="save" onclick="saveMessage()">💾 Save Message</button>

  <button class="start" onclick="startBot()">🚀 Start Bot</button>
  <button class="stop" onclick="stopBot()">🛑 Stop Bot</button>
</div>

<div class="card">
  <div class="log-header">
    <h2>📜 Bot Logs</h2>
    <button class="clear" onclick="clearLogs()">Clear Logs</button>
  </div>
  <div id="logs"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const logs = document.getElementById('logs');

  socket.on('log', (msg) => {
    const p = document.createElement('div');
    p.textContent = msg;
    logs.appendChild(p);
    logs.scrollTop = logs.scrollHeight;
  });

  // Page load hone par message.txt padho
  window.onload = async () => {
    const res = await fetch('/get-message');
    const data = await res.json();
    document.getElementById('messageBox').value = data.message;
  };

  async function saveMessage() {
    const message = document.getElementById('messageBox').value;
    await fetch('/save-message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });
    alert('✅ Message save ho gaya!');
  }

  async function startBot() {
    const groupId = document.getElementById('groupId').value;
    const interval = document.getElementById('interval').value;
    const cookies = document.getElementById('cookies').value;

    if (!cookies.trim()) {
      alert('Pehle cookies paste karein!');
      return;
    }

    const res = await fetch('/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ groupId, interval, cookies })
    });
    const data = await res.json();
    console.log(data);
  }

  async function stopBot() {
    await fetch('/stop', { method: 'POST' });
  }

  function clearLogs() {
    logs.innerHTML = '';
  }
</script>

</body>
</html>
