<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Bot Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .panel-container {
            width: 100%;
            max-width: 500px;
            background: #050a12;
            border: 3px solid #00d2ff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px #00d2ff, inset 0 0 10px #00d2ff;
        }
        h1 {
            text-align: center;
            color: #00d2ff;
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00d2ff;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a0c0d0;
            margin-bottom: 8px;
        }
        input, textarea {
            width: 100%;
            background: #000000;
            border: 2px solid #00d2ff;
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            box-shadow: inset 0 0 5px rgba(0, 210, 255, 0.2);
        }
        input:focus, textarea:focus {
            box-shadow: 0 0 10px #00d2ff, inset 0 0 5px #00d2ff;
        }
        textarea {
            resize: none;
            height: 100px;
        }
        .btn-start {
            width: 100%;
            background: #00d2ff;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 15px #00d2ff;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-start:hover {
            background: #ffffff;
            box-shadow: 0 0 25px #ffffff;
        }
        #response-msg {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="panel-container">
    <h1>FACEBOOK BOT</h1>
    
    <div class="form-group">
        <label>Account Session (Cookies)</label>
        <textarea id="cookies" placeholder="PASTE COOKIES JSON..."></textarea>
    </div>

    <div class="form-group">
        <label>Enter Group UID</label>
        <input type="text" id="groupUid" placeholder="TARGET GROUP ID">
    </div>

    <div class="form-group">
        <label>Enter Group Name</label>
        <input type="text" id="groupName" placeholder="GROUP NAME LOCK">
    </div>

    <div class="form-group">
        <label>Select All Nickname (All)</label>
        <input type="text" id="nicknameLock" placeholder="ENTER ALL NICKNAME LOCK">
    </div>

    <div class="form-group">
        <label>Enter Speed (Second)</label>
        <input type="number" id="speed" value="10" placeholder="10">
    </div>

    <button class="btn-start" onclick="startFacebookBot()">Start Bot..!!</button>
    
    <div id="response-msg"></div>
</div>

<script>
    async function startFacebookBot() {
        const msgDiv = document.getElementById('response-msg');
        msgDiv.innerHTML = "Processing...";
        msgDiv.style.color = "#00d2ff";

        const payload = {
            cookies: document.getElementById('cookies').value,
            groupUid: document.getElementById('groupUid').value,
            groupName: document.getElementById('groupName').value,
            nicknameLock: document.getElementById('nicknameLock').value,
            speed: document.getElementById('speed').value
        };

        try {
            const response = await fetch('/api/start-bot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            
            if(result.success) {
                msgDiv.innerHTML = result.message;
                msgDiv.style.color = "#00ffcc";
            } else {
                msgDiv.innerHTML = result.message;
                msgDiv.style.color = "#ff3366";
            }
        } catch (error) {
            msgDiv.innerHTML = "🚨 Server connection error!";
            msgDiv.style.color = "#ff3366";
        }
    }
</script>

</body>
</html>
